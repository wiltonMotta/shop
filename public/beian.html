<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站备案中 - 西乡县服装店</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #333;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 60px 40px;
  max-width: 520px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}
.icon { font-size: 64px; margin-bottom: 20px; }
h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 12px; }
.status {
  display: inline-block; background: #fff3cd; color: #856404;
  padding: 6px 20px; border-radius: 20px; font-size: 14px; font-weight: 500;
  margin-bottom: 24px;
}
p { font-size: 15px; color: #666; line-height: 1.8; margin-bottom: 8px; }
.info {
  background: #f8f9fa; border-radius: 12px; padding: 20px;
  margin: 24px 0; text-align: left;
}
.info-item { display: flex; margin-bottom: 10px; font-size: 14px; }
.info-item:last-child { margin-bottom: 0; }
.label { color: #999; width: 80px; flex-shrink: 0; }
.value { color: #333; flex: 1; }
.footer { font-size: 12px; color: #aaa; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📋</div>
  <h1>网站备案中</h1>
  <div class="status">ICP Filing in Progress</div>
  <p>本网站正在向主管部门提交备案申请，<br>审核期间暂时无法访问，敬请谅解。</p>
  <div class="info">
    <div class="info-item"><span class="label">主体名称</span><span class="value">西乡县服装店</span></div>
    <div class="info-item"><span class="label">经营范围</span><span class="value">服装零售</span></div>
    <div class="info-item"><span class="label">备案状态</span><span class="value">审核中</span></div>
  </div>
  <p style="font-size: 13px; color: #999;">审核通过后，本站将恢复正常访问。</p>
  <div class="footer">&copy; 2026 西乡县服装店</div>
</div>
</body>
</html>
